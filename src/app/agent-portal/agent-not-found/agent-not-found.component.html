<section class="not-found" aria-labelledby="not-found-title">
  <div class="not-found__content">
    <div class="not-found__symbol" aria-hidden="true">
      <ap-icon name="alert" [size]="30" />
    </div>

    <p class="not-found__code">404</p>
    <h1 id="not-found-title">This page is not in your portal.</h1>
    <p class="not-found__message">
      The link may be out of date, or the address may have been entered incorrectly.
    </p>

    <nav class="not-found__actions" aria-label="Choose where to go next">
      <a routerLink="/agent-portal/dashboard" class="ap-btn ap-btn--primary">
        <ap-icon name="dashboard" [size]="17" />
        Go to dashboard
      </a>
      <a routerLink="/agent-home" class="ap-btn ap-btn--quiet">
        <ap-icon name="globe" [size]="17" />
        Agent home
      </a>
    </nav>
  </div>
</section>
