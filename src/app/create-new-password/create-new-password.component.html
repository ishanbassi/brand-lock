<app-auth-layout class="auth-page" headline="Set a new password." subline="Choose a strong password you haven't used before on Trademarx.">
  <form authForm class="site-form" novalidate="novalidate" #loginForm="ngForm" (ngSubmit)="contiune(loginForm.form)">
    <p class="auth-eyebrow">Account recovery</p>
    <h1 class="auth-title">Reset password</h1>
    <p class="auth-lede">Enter a new password for your account.</p>

    <div class="auth-field">
      <label for="password" class="auth-label">New password</label>
      <div class="auth-input-wrap">
        <input #userPassword="ngModel" [type]="passwordFieldType" id="password" name="userPassword" class="auth-input"
          [class.has-error]="!userPassword.valid && (onClickValidation || userPassword.touched || userPassword.dirty)"
          required [(ngModel)]="data.newPassword" placeholder="Enter password"
          pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&()-_=+\{};:.?*?])[A-Za-z\d!@#$%^&()-_=+\{};:.?*?]{8,}">
        <button type="button" class="auth-input-btn" (click)="eyePassword()"
          [attr.aria-label]="passwordFieldType === 'password' ? 'Show password' : 'Hide password'">
          @if (passwordFieldType === 'password') {
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 10s3-6 8-6 8 6 8 6-3 6-8 6-8-6-8-6Z"/><circle cx="10" cy="10" r="2.5"/>
            </svg>
          } @else {
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 10s3-6 8-6 8 6 8 6-3 6-8 6-8-6-8-6Z"/><circle cx="10" cy="10" r="2.5"/><path d="m3 3 14 14"/>
            </svg>
          }
        </button>
      </div>
      <app-validation-message [field]="userPassword"
        [customPatternMessage]="'Must be at least 8 characters and include a capital letter, number, and special character.'"
        [onClickValidation]="userPassword.dirty || userPassword.touched || onClickValidation">
      </app-validation-message>
    </div>

    <div class="auth-field">
      <label for="confirmpassword" class="auth-label">Confirm new password</label>
      <div class="auth-input-wrap">
        <input #confirmPassword="ngModel" [type]="confirmPasswordFieldType" id="confirmpassword" name="confirmPassword"
          class="auth-input"
          [class.has-error]="(!confirmPassword.valid && (onClickValidation || confirmPassword.touched || confirmPassword.dirty)) || (data.newPassword !== data.confirmPassword)"
          required [(ngModel)]="data.confirmPassword" placeholder="Re-enter password"
          pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&()-_=+\{};:.?*?])[A-Za-z\d!@#$%^&()-_=+\{};:.?*?]{8,}">
        <button type="button" class="auth-input-btn" (click)="eyeConfirmPassword($event)"
          [attr.aria-label]="confirmPasswordFieldType === 'password' ? 'Show password' : 'Hide password'">
          @if (confirmPasswordFieldType === 'password') {
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 10s3-6 8-6 8 6 8 6-3 6-8 6-8-6-8-6Z"/><circle cx="10" cy="10" r="2.5"/>
            </svg>
          } @else {
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 10s3-6 8-6 8 6 8 6-3 6-8 6-8-6-8-6Z"/><circle cx="10" cy="10" r="2.5"/><path d="m3 3 14 14"/>
            </svg>
          }
        </button>
      </div>
      <app-validation-message [field]="confirmPassword"
        [customPatternMessage]="'Must be at least 8 characters and include a capital letter, number, and special character.'"
        [comparableField]="userPassword"
        [onClickValidation]="confirmPassword.dirty || confirmPassword.touched || onClickValidation">
      </app-validation-message>
    </div>

    <button type="submit" class="auth-btn-primary" [disabled]="loginForm.form.invalid">Reset password</button>

    <p class="auth-foot">
      Don't have an account yet? <a [routerLink]="['/create-account']" class="auth-link">Create one for free</a>
    </p>
  </form>
</app-auth-layout>
