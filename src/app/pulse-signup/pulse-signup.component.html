<div class="pulse-signup-card" *ngIf="!submitted">
  <div class="ps-copy">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M22 6l-10 7L2 6"/>
      <rect x="2" y="4" width="20" height="16" rx="2"/>
    </svg>
    <span>Get a <strong>free weekly digest</strong> of new filings in your NICE class, straight to your inbox.</span>
  </div>
  <form class="ps-form" [formGroup]="form" (ngSubmit)="submit()">
    <select class="ps-select" formControlName="tmClass" [class.invalid]="form.get('tmClass')?.touched && form.get('tmClass')?.invalid">
      <option [ngValue]="null" disabled>Select your class</option>
      <option *ngFor="let c of classes" [ngValue]="c.num">Class {{ c.num }} — {{ c.name }}</option>
    </select>
    <input
      type="email"
      class="ps-input"
      placeholder="you@email.com"
      formControlName="email"
      autocomplete="email"
      [class.invalid]="form.get('email')?.touched && form.get('email')?.invalid"
    />
    <button class="ps-submit" type="submit" [disabled]="isSubmitting">
      <span *ngIf="!isSubmitting">Subscribe</span>
      <span *ngIf="isSubmitting">Sending…</span>
    </button>
  </form>
  <p class="ps-error" *ngIf="form.get('tmClass')?.touched && form.get('tmClass')?.invalid">Please select a class.</p>
  <p class="ps-error" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">Please enter a valid email address.</p>
  <p class="ps-error" *ngIf="errorMessage">{{ errorMessage }}</p>
</div>

<div class="pulse-signup-success" *ngIf="submitted">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
    <polyline points="22 4 12 14.01 9 11.01"/>
  </svg>
  <span>Check your inbox — confirm the link we just sent to start getting your weekly digest.</span>
</div>
