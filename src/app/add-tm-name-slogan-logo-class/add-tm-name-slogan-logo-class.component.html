<section class="add-tm-section">
  <div class="container-xxl">
    <div class="row">
      <div class="col col-12 col-sm-12 col-lg-7">

        <div class="step-heading">
          <h1>Brand Details</h1>
          <p>Tell us about the trademark you want to protect.</p>
        </div>

        <section class="form-section">
          <form (ngSubmit)="submit()" [formGroup]="trademarkDetailsForm"
                [ngClass]="{'submitted': onClickValidation}">

            <!-- Brand Name -->
            <div class="form-group" formGroupName="trademark"
                 *ngIf="trademark?.type === TrademarkTypeEnum.TRADEMARK
                      || trademark?.type === TrademarkTypeEnum.TRADEMARK_WITH_IMAGE
                      || trademark?.type === TrademarkTypeEnum.ALL">
              <label for="name">Brand name you want to protect</label>
              <input id="name" type="text" class="form-input"
                     placeholder="Enter your brand name"
                     formControlName="name">
              <div class="field-error"
                   *ngIf="trademarkDetailsForm.get('trademark')?.get('name')?.hasError('required') && onClickValidation">
                Brand name is required
              </div>
            </div>

            <!-- Logo Upload -->
            <div class="form-group"
                 *ngIf="trademark?.type === TrademarkTypeEnum.IMAGEMARK
                      || trademark?.type === TrademarkTypeEnum.TRADEMARK_WITH_IMAGE
                      || trademark?.type === TrademarkTypeEnum.ALL">
              <label>Logo you want to trademark</label>

              <div *ngIf="trademarkDetailsForm.get('file')?.value" class="logo-preview">
                <div class="img-wrap">
                  <img loading="lazy" alt="logo"
                       [src]="'data:' + trademarkDetailsForm.get('document')?.get('fileContentType')?.value
                              + ';base64,' + trademarkDetailsForm.get('file')?.value"
                       class="logo-img">
                  <button type="button" class="clear-img-btn"
                          (click)="clearInputImage('file', 'fileContentType', 'fileInput')">
                    ✕
                  </button>
                </div>
                <div class="file-name-note">
                  File: <span>{{ trademarkDetailsForm.get('document')?.get('fileName')?.value }}</span>
                </div>
              </div>

              <input *ngIf="!trademarkDetailsForm.get('file')?.value"
                     type="file" id="fileInput" class="file-input"
                     accept=".png, .jpg, .jpeg, .svg"
                     (change)="setFileData($event, 'file', true)">

              <input type="hidden" formControlName="file">
              <div formGroupName="document">
                <input type="hidden" formControlName="fileContentType">
                <input type="hidden" formControlName="fileName">
                <input type="hidden" formControlName="documentType" value="LOGO">
              </div>

              <div class="field-error"
                   *ngIf="trademarkDetailsForm.get('file')?.hasError('required') && onClickValidation">
                Logo is required
              </div>
            </div>

            <!-- Slogan -->
            <div class="form-group"
                 *ngIf="trademark?.type === TrademarkTypeEnum.SLOGAN
                      || trademark?.type === TrademarkTypeEnum.ALL">
              <label for="trademarkSlogan">Slogan you want to protect</label>
              <input id="trademarkSlogan" type="text" class="form-input"
                     placeholder="Enter your slogan"
                     formControlName="trademarkSlogan" required>
              <div class="field-error"
                   *ngIf="trademarkDetailsForm.get('trademarkSlogan')?.hasError('required') && onClickValidation">
                Slogan is required
              </div>
            </div>

          </form>

          <app-trademark-onboarding-btn-section
            (backEvent)="back()"
            [isSubmitting]="isSubmitting"
            (buttonClick)="submit()">
          </app-trademark-onboarding-btn-section>
        </section>

      </div>
    </div>
  </div>
</section>
