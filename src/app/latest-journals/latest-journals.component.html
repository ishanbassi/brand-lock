<div class="section-header" *ngIf="journals.length">
  <h2 class="section-title">Latest Trademark Journals</h2>
  <a class="section-link" routerLink="/trademark-journal">View all →</a>
</div>

<div class="journal-grid" *ngIf="journals.length">
  <a
    class="journal-card"
    *ngFor="let journal of journals; let i = index"
    [routerLink]="['/trademark-journal', journal.journalNo]"
    [style.animation-delay]="(i * 60) + 'ms'"
  >
    <div class="journal-no">Journal No. {{ journal.journalNo }}</div>
    <div class="journal-meta" *ngIf="journal.publishedDate">Published {{ journal.publishedDate | date: 'dd MMM yyyy' }}</div>
    <div class="journal-count">{{ journal.count }} trademarks</div>
  </a>
</div>
