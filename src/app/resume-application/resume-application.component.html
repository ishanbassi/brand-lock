@if (visible) {
  <div class="resume-card" role="dialog" aria-label="Resume your trademark application">
    <button type="button" class="resume-close" aria-label="Dismiss" (click)="dismiss()">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    </button>

    <div class="resume-body">
      <div class="resume-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
          <polyline points="14 2 14 8 20 8" />
          <polygon points="10 12 15 15 10 18 10 12" fill="currentColor" stroke="none" />
        </svg>
      </div>

      <div class="resume-content">
        <p class="resume-title">Continue your application</p>
        <p class="resume-text">
          @if (brandName) {
            You started registering <strong>“{{ brandName }}”</strong>.
          } @else {
            You have a trademark application in progress.
          }
          Pick up right where you left off.
        </p>

        <div class="resume-progress">
          <div class="resume-progress-head">
            <span>Step {{ stepIndex }} of {{ totalSteps }} · {{ stepLabel }}</span>
            @if (leftAgo) { <span class="resume-ago">Left {{ leftAgo }}</span> }
          </div>
          <div class="resume-bar" [attr.aria-valuenow]="progressPercent" role="progressbar"
               aria-valuemin="0" aria-valuemax="100">
            <span class="resume-bar-fill" [style.width.%]="progressPercent"></span>
          </div>
        </div>

        <div class="resume-actions">
          <button type="button" class="resume-btn-primary" (click)="continue()">
            Continue application
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12" />
              <polyline points="12 5 19 12 12 19" />
            </svg>
          </button>
          <button type="button" class="resume-btn-ghost" (click)="dismiss()">Not now</button>
        </div>
      </div>
    </div>
  </div>
}
