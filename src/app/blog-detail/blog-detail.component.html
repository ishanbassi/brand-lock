

<header class="blog-hero" [ngStyle]="{'background-color': blog?.backgroundColor}">
    <div class="blog-hero__container">
        <nav class="breadcrumb">
            <a href="javascript:void(0)">Trademarx</a>
            <span>›</span>
            <a routerLink="/blogs">Blog</a>
            <span>›</span>
            <a href="javascript:void(0)">{{blog?.category}}</a>

        </nav>

        <h1 class="blog-title">
            {{blog?.title}}
        </h1>

        <div class="blog-meta">
            <span>Author: <strong>{{blog?.author || 'Trademarx'}}</strong></span>
            <span>•</span>
            <span>10 min read</span>
            <span>•</span>
            <span>{{blog?.createdAt?.format('MMM D, YYYY')}}</span>
        </div>

    </div>
</header>

<div class="blog-single">
    <div class="container">
        <div class="row justify-center">
            <div class="col-lg-8 col-xl-7 col-xxl-6 m-15px-tb">
                <article class="article">
                    <div class="article-img">
                        <img  loading="lazy" [src]="blogBaseUrl+ blog?.featuredImage?.url" [title]="blog?.title" [alt]="blog?.title">
                    </div>
                    <div class="article-content">

                        <app-blog-markdown [blog]="blog" (markdownReady)="onMarkdownReady()"></app-blog-markdown>
                    </div>
                </article>
            </div>
            <div class="col-lg-4 col-xl-3 m-15px-tb blog-aside">
                <aside>
                    <div class="toc">
                        <h4>📑 Table of Contents</h4>

                        <ul class="toc-list">
                            <li *ngFor="let item of visibleToc">

                                <!-- Parent heading -->
                                <div class="toc-parent">
                                    <a [routerLink]="[]" [fragment]="item.id">
                                        {{ item.text }}
                                    </a>

                                    <button *ngIf="item.children.length" class="toggle-btn"
                                        (click)="item.expanded = !item.expanded">
                                        {{ item.expanded ? '−' : '+' }}
                                    </button>
                                </div>

                                <!-- Child headings -->
                                <ul class="toc-children" *ngIf="item.children.length && item.expanded">
                                    <li *ngFor="let child of item.children">
                                        <a [routerLink]="[]" [fragment]="child.id">
                                            {{ child.text }}
                                        </a>
                                    </li>
                                </ul>

                            </li>
                        </ul>

                        <!-- Show more / less -->
                        <button class="show-more" *ngIf="toc.length > previewCount" (click)="showAll = !showAll">
                            {{ showAll ? 'Show less' : 'Show more' }}
                        </button>
                    </div>
                    <div class="aside-lead">
                        <app-lead-form
                            [heading]="blog?.campaignBlock?.title || 'Talk to a Trademark Expert'"
                            [cta]="blog?.campaignBlock?.ctaText || 'Get a Free Callback'"
                            [serviceType]="leadServiceType"
                            [showTextArea]="false"></app-lead-form>
                    </div>
                </aside>





            </div>
        </div>
    </div>
</div>

<!-- Mobile floating Table of Contents (main headings only) -->
<div class="mobile-toc" *ngIf="toc.length">
    <div class="mobile-toc__backdrop" [class.is-open]="mobileTocOpen" (click)="closeMobileToc()"></div>

    <div class="mobile-toc__sheet" [class.is-open]="mobileTocOpen">
        <div class="mobile-toc__head">
            <span>On this page</span>
            <button type="button" class="mobile-toc__close" (click)="closeMobileToc()" aria-label="Close">✕</button>
        </div>
        <ul class="mobile-toc__list">
            <li *ngFor="let item of toc; let i = index">
                <a [routerLink]="[]" [fragment]="item.id" (click)="closeMobileToc()">
                    <span class="mobile-toc__num">{{ i + 1 }}</span>
                    <span class="mobile-toc__text">{{ item.text }}</span>
                </a>
            </li>
        </ul>
    </div>

    <button type="button" class="mobile-toc__fab" [class.is-open]="mobileTocOpen"
        (click)="toggleMobileToc()" aria-label="Table of contents">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="mobile-toc__fab-label">Contents</span>
    </button>
</div>
