<app-auth-layout class="auth-page" headline="Welcome back." subline="Sign in to track your filings, manage documents and pick up where you left off.">
  <form authForm class="site-form" novalidate="novalidate" #loginForm="ngForm" (ngSubmit)="login(loginForm.form)">
    <p class="auth-eyebrow">Account access</p>
    <h1 class="auth-title">Sign in</h1>

    <div class="auth-field">
      <label for="userEmail" class="auth-label">Email address</label>
      <div class="auth-input-wrap">
        <input #userEmail="ngModel" type="email" id="userEmail" name="userEmail" class="auth-input"
          [class.has-error]="!userEmail.valid && (onClickValidation || userEmail.touched || userEmail.dirty)"
          required [(ngModel)]="data.username" placeholder="you@example.com" autocomplete="email">
      </div>
      <app-validation-message [field]="userEmail" [customPatternMessage]="'Please provide a valid email address'"
        [onClickValidation]="userEmail.dirty || userEmail.touched || onClickValidation">
      </app-validation-message>
    </div>

    <div class="auth-field">
      <label for="userPassword" class="auth-label">Password</label>
      <div class="auth-input-wrap">
        <input #userPassword="ngModel" [type]="passwordFieldType" id="userPassword" name="userPassword"
          class="auth-input" [class.has-error]="!userPassword.valid && (onClickValidation || userPassword.touched || userPassword.dirty)"
          required [(ngModel)]="data.password" placeholder="Enter password" autocomplete="current-password">
        <button type="button" class="auth-input-btn" (click)="eyePassword()"
          [attr.aria-label]="passwordFieldType === 'password' ? 'Show password' : 'Hide password'">
          @if (passwordFieldType === 'password') {
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 10s3-6 8-6 8 6 8 6-3 6-8 6-8-6-8-6Z"/><circle cx="10" cy="10" r="2.5"/>
            </svg>
          } @else {
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 10s3-6 8-6 8 6 8 6-3 6-8 6-8-6-8-6Z"/><circle cx="10" cy="10" r="2.5"/><path d="m3 3 14 14"/>
            </svg>
          }
        </button>
      </div>
      <app-validation-message [field]="userPassword" [customPatternMessage]="'Please provide a valid value.'"
        [onClickValidation]="userPassword.dirty || userPassword.touched || onClickValidation">
      </app-validation-message>
    </div>

    <div class="auth-row-between">
      <a [routerLink]="['/forgot-password']" class="auth-link">Forgot password?</a>
    </div>

    <button type="submit" class="auth-btn-primary" [disabled]="loginForm.form.invalid">Sign in</button>

    <p class="auth-foot">New here? <a [routerLink]="['/create-account']" class="auth-link">Create a free account</a></p>
  </form>
</app-auth-layout>

<app-common-register-login-mobile-section></app-common-register-login-mobile-section>
