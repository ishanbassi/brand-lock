<section class="btn-section">
    <button *ngIf="showBackBtn" type="button" class="btn-back" (click)="back()">
        ← Back
    </button>
    <button *ngIf="showNextBtn" type="button" class="btn-continue"
        [disabled]="isSubmitting" (click)="submit()">
        <span *ngIf="!isSubmitting">Continue →</span>
        <span *ngIf="isSubmitting">Please wait…</span>
    </button>
</section>
